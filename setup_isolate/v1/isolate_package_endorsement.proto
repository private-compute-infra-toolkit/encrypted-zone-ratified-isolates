syntax = "proto3";

package setup_isolate.v1;

// PES Endorsement data for the Isolate package that needs to be validated.
message IsolatePackageEndorsement {
  // Raw JSON bytes of the endorsement statement.
  bytes endorsement_json = 1;
  // Raw bytes of the signature over the endorsement statement.
  bytes signature = 2;
  // Raw JSON bytes of the PES confirmation.
  bytes pes_confirmation_json = 3;
}
