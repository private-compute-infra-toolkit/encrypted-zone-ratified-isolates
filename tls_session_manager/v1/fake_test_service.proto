syntax = "proto3";

package fake_test_service.v1;

message UpperCaseRequest {
  string input = 1;
}

message UpperCaseResponse {
  string output = 1;
}

service UpperCaseService {
  rpc UpperCaseStream(stream UpperCaseRequest) returns (stream UpperCaseResponse);
}
