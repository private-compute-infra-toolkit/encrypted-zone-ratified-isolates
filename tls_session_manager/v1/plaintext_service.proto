syntax = "proto3";

package tls_session_manager.v1.plaintext_service;

message PlaintextMessage {
  bytes payload = 1;
}

// Interface provided by the downstream service that will actually process the
// decrypted messages and provide responses.
//
// The downstream service can use this proto directly to define the service, or
// define any binary-compatible method, and provide the service and method name
// as arguments to the call.
service PlaintextServiceSession {
  rpc PlaintextStream(stream PlaintextMessage) returns (stream PlaintextMessage);
}
